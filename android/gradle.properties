# VM is RAM-constrained (8 GB shared): keep the daemon lean.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
# Single-JVM compile: the VM cannot afford a separate Kotlin daemon heap.
kotlin.compiler.execution.strategy=in-process
# Egress goes through the runtime proxy, which answers these hosts
# without authentication (verified 2026-11-10). Host/port only — no
# credentials are ever written here.
systemProp.http.proxyHost=hatch-egress-proxy
systemProp.http.proxyPort=3128
systemProp.https.proxyHost=hatch-egress-proxy
systemProp.https.proxyPort=3128
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
