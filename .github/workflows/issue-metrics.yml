name: Issue metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 1 * *"

permissions:
  contents: read
  issues: read

jobs:
  metrics:
    name: Monthly issue metrics
    runs-on: ubuntu-latest
    steps:
      - name: Measure the last month
        uses: github-community-projects/issue-metrics@v3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TITLE: "Issue metrics — last 30 days"
          SEARCH_QUERY: "repo:DeskGuest-App/DeskGuest is:issue created:@today-30d..today"
