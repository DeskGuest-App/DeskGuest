name: Draft release

# Skeleton: pushing a version tag opens a DRAFT GitHub release with
# generated notes. Asset uploads join this workflow when the release
# programme starts shipping installers; nothing is published by CI.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
