name: Feature or feedback request
description: Something DeskGuest should do, or do better
title: "[Request]: "
labels: ["type: feedback", "state: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you were trying to do. Requests are read by the support team and
        tracked on the project's public board.
  - type: textarea
    id: wish
    attributes:
      label: What do you wish DeskGuest could do?
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: When would it help?
      description: The situation where this would have made a difference.
  - type: dropdown
    id: platform
    attributes:
      label: Which DeskGuest is this about?
      options:
        - Windows
        - Android
        - Both
        - The website
        - Not sure
    validations:
      required: true
